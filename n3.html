<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N3 日文動詞測驗</title>
<style>
    /* CSS Variables for Dark / Bright Mode */
    :root {
        --bg-color: #f0f8ff;
        --card-bg: rgba(255, 255, 255, 0.85);
        --text-color: #333;
        --primary-color: #4CAF50;
        --primary-hover: #45a049;
        --border-color: #ccc;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --input-bg: #fff;
        --input-text: #000;
        --feedback-correct: #28a745;
        --feedback-incorrect: #dc3545;
    }

    [data-theme="dark"] {
        --bg-color: #1a1a2e;
        --card-bg: rgba(30, 30, 46, 0.85);
        --text-color: #e0e0e0;
        --primary-color: #0f3460;
        --primary-hover: #e94560;
        --border-color: #444;
        --shadow-color: rgba(0, 0, 0, 0.5);
        --input-bg: #2a2a3e;
        --input-text: #fff;
        --feedback-correct: #4caf50;
        --feedback-incorrect: #ff4c4c;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Glassmorphism Container */
    .container {
        width: 100%;
        max-width: 600px;
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 8px 32px 0 var(--shadow-color);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-sizing: border-box;
        margin: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .header-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    h1 {
        margin: 0;
        font-size: 1.8rem;
    }

    /* Toggle Button */
    .theme-toggle {
        background: transparent;
        border: 2px solid var(--text-color);
        color: var(--text-color);
        border-radius: 20px;
        padding: 5px 15px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
    }
    .theme-toggle:hover {
        background: var(--text-color);
        color: var(--bg-color);
    }

    /* Options Grid */
    .options-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    
    .options-area label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 8px;
        transition: background 0.2s;
    }

    .options-area label:hover {
        background: rgba(128, 128, 128, 0.1);
    }

    .question-area {
        text-align: center;
        padding: 20px;
        background: rgba(0,0,0,0.03);
        border-radius: 10px;
    }

    h3#question {
        margin-top: 0;
        font-size: 1.4rem;
    }

    input[type="text"] {
        width: 80%;
        padding: 12px;
        margin-top: 10px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 1.1rem;
        background-color: var(--input-bg);
        color: var(--input-text);
        transition: all 0.3s ease;
    }

    input[type="text"]:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
    }

    .btn-group {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    button.primary-btn {
        padding: 10px 25px;
        font-size: 1rem;
        color: #fff;
        background-color: var(--primary-color);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
    }
    button.primary-btn:hover {
        background-color: var(--primary-hover);
    }

    .result-area {
        text-align: center;
        min-height: 80px;
    }

    #feedback {
        font-size: 1.2rem;
        font-weight: bold;
        min-height: 30px;
        margin-bottom: 10px;
    }
    .correct { color: var(--feedback-correct); }
    .incorrect { color: var(--feedback-incorrect); }

    .last-correct-box {
        margin-top: 10px;
        padding: 10px;
        background: rgba(128, 128, 128, 0.1);
        border-radius: 8px;
        font-size: 0.95rem;
    }

    /* Animations */
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }
    .shake {
        animation: shake 0.4s ease-in-out;
        border-color: var(--feedback-incorrect) !important;
    }
    
    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    .pop {
        animation: pop 0.3s ease-in-out;
    }

    /* RWD */
    @media (max-width: 480px) {
        .options-area {
            grid-template-columns: 1fr;
        }
        input[type="text"] {
            width: 95%;
        }
    }
    #explanation { white-space: pre-wrap; line-height: 1.7; text-align: left; }
    #status { font-size: 0.9rem; }
    button:disabled, input:disabled { opacity: 0.5; cursor: wait; }
    body { min-height: 100vh; height: auto; }
    .container { height: auto; margin: 20px auto; }
    .options-area br { display: none; }
    input[type="text"] { box-sizing: border-box; }
    .btn-group { flex-wrap: wrap; }
</style>
</head>
<body data-level="n3">

<div class="container">
    <div class="header-area">
        <h1>N3 動詞測驗</h1>
        <button class="theme-toggle" onclick="toggleTheme()">切換主題</button>
    </div>
    
    <!-- 題目類型選擇 -->
    <div class="options-area">
        <label><input type="radio" name="questionType" value="1" checked onchange="loadQuestion()"> 中文 -> 原型</label>
        <label><input type="radio" name="questionType" value="2" onchange="loadQuestion()"> 原型 -> ます型</label>
        <label><input type="radio" name="questionType" value="3" onchange="loadQuestion()"> 原型 -> て型</label>
        <label><input type="radio" name="questionType" value="4" onchange="loadQuestion()"> 原型 -> ない型</label>
        <label><input type="radio" name="questionType" value="5" onchange="loadQuestion()"> 原形 → た形</label><br/>
        <label><input type="radio" name="questionType" value="6" onchange="loadQuestion()"> 漢字 → 假名讀音</label><br/>
        <label><input type="radio" name="questionType" value="7" onchange="loadQuestion()"> 變形 → 原形</label><br/>
        <label><input type="radio" name="questionType" value="8" onchange="loadQuestion()"> 混合題型（含進階題）</label><br/>
        <label><input type="radio" name="questionType" value="9" onchange="loadQuestion()"> 近義詞辨析</label><br/>
        <label><input type="radio" name="questionType" value="10" onchange="loadQuestion()"> 自他動詞辨析</label><br/>
    </div>
    
    <div class="question-area">
        <p id="status" role="status">題庫載入中…</p>
        <h3 id="question">題目載入中...</h3>
        <input type="text" id="answer" placeholder="輸入答案；留空按 Enter 看答案" onkeydown="handleKeyPress(event)" autocomplete="off">
        <div class="btn-group">
            <button class="primary-btn" onclick="checkAnswer()">提交</button>
            <button class="primary-btn" onclick="loadQuestion()">下一題</button>
            <button class="primary-btn" onclick="speakText()">🔊 發音</button>
        </div>
    </div>
    
    <div class="result-area">
        <p id="feedback" aria-live="polite"></p>
        <p id="explanation" aria-live="polite"></p>
        <div class="last-correct-box">
            <strong>上一次正確的題目和答案:</strong><br>
            <span id="last-correct">尚無記錄</span>
        </div>
    </div>
</div>

<script src="quiz.js"></script>
<script src="legacy-navigation.js"></script>
</body>
</html>
